name: Release

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送 v* 标签（如 v1.0.0）

jobs:
  build-dmg:
    name: Build and Release DMG
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DMG_NAME=PasteDeck-$VERSION.dmg" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build DMG
        run: make dmg
        env:
          VERSION: ${{ env.VERSION }}

      - name: Verify build artifacts
        run: |
          ls -lh "$DMG_NAME"
          ls -lh "$DMG_NAME.sha256"
          cat "$DMG_NAME.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PasteDeck-*.dmg
            PasteDeck-*.dmg.sha256
          body: |
            ## PasteDeck ${{ github.ref_name }}

            现代化的 macOS 剪贴板管理器

            ### 安装说明

            1. **下载 DMG 文件**
               - 下载下方的 `PasteDeck-*.dmg` 文件

            2. **安装应用**
               - 双击打开 DMG 文件
               - 将 PasteDeck 拖拽到 Applications 文件夹

            3. **首次运行（重要）**
               - 双击 Applications 中的 PasteDeck
               - 会看到"无法打开"的警告（这是正常的）
               - 打开 **系统设置 → 隐私与安全性**
               - 向下滚动到"安全性"部分
               - 点击 **"仍要打开"** 按钮
               - 输入管理员密码
               - 在确认对话框中点击"打开"

            4. **后续使用**
               - 以后打开应用不再需要上述步骤
               - 设置快捷键：默认 Cmd+Shift+V

            ### 为什么需要手动批准？

            PasteDeck 是开源软件，使用 ad-hoc 签名分发（无需付费的 Apple Developer Account）。
            macOS Gatekeeper 要求首次运行时手动批准非公证应用。这是一次性操作。

            ### 验证下载完整性

            ```bash
            shasum -a 256 PasteDeck-*.dmg
            # 对比 .sha256 文件中的哈希值
            ```

            ### 功能特性

            - ✅ 剪贴板历史记录（支持文本、图片、文件、颜色等）
            - ✅ 快捷键快速访问（Cmd+Shift+V）
            - ✅ 智能搜索和过滤
            - ✅ 收藏和置顶
            - ✅ 自动粘贴到活动应用
            - ✅ 音效反馈
            - ✅ 自定义保留策略
            - ✅ iCloud 同步（可选）

            ### 系统要求

            - macOS 13.0 (Ventura) 或更高版本
            - Apple Silicon 或 Intel Mac

            ### 问题反馈

            遇到问题？请在 [Issues](https://github.com/${{ github.repository }}/issues) 中反馈。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
